<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Converge</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #f5f5f0; color: #18231f;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        font-size: 14px; line-height: 1.55;
      }
      .box {
        max-width: 420px; margin: 0 16px; padding: 40px;
        background: #fffefa; border: 1px solid #dfe5df; border-radius: 18px;
        text-align: center; box-shadow: 0 18px 48px rgba(24, 35, 31, .08);
      }
      h1 { font-size: 18px; margin: 0 0 12px; }
      p { color: #66736d; margin: 0 0 20px; }
      button {
        font: inherit; padding: 9px 14px; border-radius: 9px; cursor: pointer;
        background: #2d6a4f; border: 1px solid #2d6a4f; color: #fff; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>연결이 끊겼습니다</h1>
      <p>
        Converge 는 지도와 경로를 그때그때 받아 와 계산합니다.
        연결이 돌아오면 다시 시도해 주세요.
      </p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
