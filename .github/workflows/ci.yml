name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    # ubuntu-latest 는 10-19 부터 Ubuntu 26 으로 옮겨 간다는 안내가 떴다. 바뀌는 날 깨지지 않게 고정 (10-31)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v4·v5 는 Node 20 이라 폐기 경고가 떴다. Node 24 로 도는 v7 (10-31)
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - name: 백엔드 시험 (API 키 없이)
        run: python -m pytest backend/tests -q   # 저장소 루트를 경로에 넣어 from backend... 가 잡히게
